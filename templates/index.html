<div class="p-4">
<div class="flex justify-between"><span class="mono text-[10px] px-2 py-1 rounded {% if item.type == 'Lost' %}bg-red-500/20 text-red-400{% else %}bg-green-500/20 text-green-400{% endif %}">{{ item.type | upper }}</span><span class="text-[10px] text-gray-500">{{ item.location }}</span></div>
<h4 class="font-bold mt-3 text-[14px]">{{ item.title }}</h4>
<p class="text-[11px] text-gray-400 mt-1 mono">Contact: {{ item.contact }}</p>
<div class="flex gap-2 mt-3">
<button onclick="openEdit({{ item.id }}, '{{ item.title }}', '{{ item.type }}', '{{ item.location }}', '{{ item.contact }}')" class="flex-1 bg-[#1f1f2e] border border-[#2a2a3a] text-[11px] py-1.5 rounded hover:bg-[#2a2a3a]">EDIT</button>
<a href="/delete/{{ item.id }}" onclick="return confirm('Delete this item?')" class="flex-1 text-center bg-red-500/10 border border-red-500/20 text-red-400 text-[11px] py-1.5 rounded hover:bg-red-500/20">DELETE</a>
</div>
</div>
