<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Item - FindIt</title>
<style>
body{background:#0a0e18;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;margin:0}
.card{background:#121726;border:1px solid #1e2538;border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
h3{margin-bottom:16px;text-align:center;font-size:18px}
input,select{width:100%;margin:7px 0;padding:12px;background:#0a0e18;border:1px solid #242d46;border-radius:10px;color:#fff;outline:none;box-sizing:border-box}
input:focus,select:focus{border-color:#6c5cff}
.btn{width:100%;padding:14px;margin-top:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer;box-sizing:border-box}
.btn-save{background:linear-gradient(135deg,#6c5cff,#2b90ff);color:#fff}
.btn-cancel{background:#1e2538;color:#888;display:block;text-align:center;text-decoration:none;padding:12px;border-radius:10px;margin-top:10px;font-size:13px}
label{font-size:10px;color:#5a647e;letter-spacing:0.1em;margin-top:6px;display:block}
</style>
</head>
<body>
<div class="card">
<h3>✏️ Update Item</h3>
<form action="/update/{{ item.id }}" method="post" enctype="multipart/form-data">
<label>TITLE</label>
<input name="title" value="{{ item.title }}" required>
<label>TYPE</label>
<select name="type" required>
<option value="Lost" {% if item.type=='Lost' %}selected{% endif %}>🔴 Lost</option>
<option value="Found" {% if item.type=='Found' %}selected{% endif %}>🟢 Found</option>
</select>
<label>LOCATION</label>
<input name="location" value="{{ item.location }}" required>
<label>CONTACT</label>
<input name="contact" value="{{ item.contact }}" required>
<label>CHANGE IMAGE (Optional)</label>
<input type="file" name="image">
<button class="btn btn-save" type="submit">💾 UPDATE NOW</button>
</form>
<a href="/" class="btn-cancel">← Cancel & Go Back</a>
</div>
</body>
</html>
