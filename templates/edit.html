<form action="/update/{{ item.id }}" method="post" enctype="multipart/form-data" style="background:#121726;padding:20px;border-radius:16px;max-width:500px;margin:40px auto">
<input name="title" value="{{ item.title }}" required style="width:100%;margin:7px 0;padding:12px;background:#0a0e18;border:1px solid #242d46;border-radius:10px;color:#fff">
<input name="location" value="{{ item.location }}" required style="width:100%;margin:7px 0;padding:12px;background:#0a0e18;border:1px solid #242d46;border-radius:10px;color:#fff">
<input name="contact" value="{{ item.contact }}" required style="width:100%;margin:7px 0;padding:12px;background:#0a0e18;border:1px solid #242d46;border-radius:10px;color:#fff">
<input name="email" value="{{ item.email }}" placeholder="Email" style="width:100%;margin:7px 0;padding:12px;background:#0a0e18;border:1px solid #242d46;border-radius:10px;color:#fff">
<input name="instagram" value="{{ item.instagram }}" placeholder="Instagram" style="width:100%;margin:7px 0;padding:12px;background:#0a0e18;border:1px solid #242d46;border-radius:10px;color:#fff">
<button type="submit" style="width:100%;padding:14px;background:#2b90ff;color:#fff;border:none;border-radius:10px;font-weight:800">UPDATE</button>
</form>
